# The free Supabase plan pauses a project after a week with too little database activity, and the
# daily Vercel cron alone is not enough. /api/health runs one database query, so calling it a few times
# a day keeps the live demo up.
name: Keep demo alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health check
        run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 20
          https://docs-assistant-rose.vercel.app/api/health
